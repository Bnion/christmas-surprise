<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Feliz Navidad 🎄</title>
    <base href="/christmas-surprise/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ChristmasSurprise.styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #1a2342 0%, #0b1026 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .password-overlay.hidden {
            display: none;
        }

        .login-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 3rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .login-container h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #FFD700;
            margin-bottom: 1rem;
        }

        .login-container p {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: #e0e0e0;
        }

        .login-container input {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 1rem;
        }

        .login-container input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-container button {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-container button:hover {
            background: #FFD700;
            color: #0b1026;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .error {
            color: #ff6b6b;
            margin-top: 1rem;
            display: none;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1em;
            animation: fall linear infinite;
            z-index: 9999;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <!-- Password Overlay -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="login-container">
            <h1>🎄 Feliz Navidad 🎄</h1>
            <p>Gib das Passwort ein, um deine Überraschung zu sehen.</p>
            <input type="password" id="passwordInput" placeholder="Passwort eingeben..." autofocus>
            <button onclick="checkPassword()">Weiter</button>
            <p class="error" id="errorMsg">❌ Falsches Passwort!</p>
        </div>
    </div>

    <!-- Blazor App -->
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        const correctPassword = "#Weinachts-Karte2025";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (input === correctPassword) {
                sessionStorage.setItem('authenticated', 'true');
                document.getElementById('passwordOverlay').classList.add('hidden');
                loadBlazor();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }

        function loadBlazor() {
            // Load Blazor scripts
            const script1 = document.createElement('script');
            script1.src = '_framework/blazor.webassembly.js';
            document.body.appendChild(script1);

            const script2 = document.createElement('script');
            script2.src = 'js/snow.js';
            document.body.appendChild(script2);

            const script3 = document.createElement('script');
            script3.src = 'js/confetti.js';
            document.body.appendChild(script3);
        }

        // Check if already authenticated
        if (sessionStorage.getItem('authenticated') === 'true') {
            document.getElementById('passwordOverlay').classList.add('hidden');
            loadBlazor();
        }

        // Enter key
        document.getElementById('passwordInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // Snowflakes
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowflake.style.opacity = Math.random();
            document.body.appendChild(snowflake);
            setTimeout(() => snowflake.remove(), 5000);
        }
        setInterval(createSnowflake, 200);
    </script>
</body>
</html>
